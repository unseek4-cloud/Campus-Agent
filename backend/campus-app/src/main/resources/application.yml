server:
  port: ${SERVER_PORT:8080}

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql,classpath:db/migration/V3__service_guide.sql,classpath:db/migration/V4__material_attachments.sql,classpath:db/migration/V5__auth_rbac.sql,classpath:db/migration/V6__service_application.sql
  servlet:
    multipart:
      max-file-size: ${ADMIN_MAX_UPLOAD_SIZE_MB:20}MB
      # Leave room for multipart headers at the configured single-file boundary (up to 100 MB).
      max-request-size: 101MB
  application:
    name: campus-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:campus_agent}
    password: ${DB_PASSWORD:}

app:
  version: 0.1.0-SNAPSHOT

campus:
  application:
    storage-path: ${APPLICATION_UPLOAD_DIR:${campus.admin.storage-path}/applications}
  auth:
    jwt-secret: ${JWT_SECRET:}
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  material:
    storage-path: ${MATERIAL_UPLOAD_DIR:${campus.admin.storage-path}/materials}
  service-guide:
    ai-timeout-seconds: ${SERVICE_GUIDE_AI_TIMEOUT_SECONDS:12}
  admin:
    max-upload-size-mb: ${ADMIN_MAX_UPLOAD_SIZE_MB:20}
    storage-path: ${ADMIN_DOCUMENT_STORAGE_PATH:var/documents}
    knowledge-base-id: ${ADMIN_KNOWLEDGE_BASE_ID:campus-default}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    rag-timeout-seconds: ${AI_SERVICE_RAG_TIMEOUT_SECONDS:90}
  knowledge:
    default-top-k: ${KNOWLEDGE_DEFAULT_TOP_K:5}
    max-top-k: ${KNOWLEDGE_MAX_TOP_K:20}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
